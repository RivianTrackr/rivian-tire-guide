name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Allows a run to be started from the Actions tab without pushing a commit
  # — useful for re-running after a transient failure, and for checking the
  # workflow itself after editing it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js-tests:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run JS validation tests
        run: npm test

      - name: Verify build
        run: npm run build

  php-unit:
    name: PHP Unit Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          tools: composer

      # The WordPress test library ships inside the wordpress-develop repo;
      # a shallow clone of trunk is the whole install.
      - name: Fetch the WordPress test library
        run: git clone --depth 1 https://github.com/WordPress/wordpress-develop /tmp/wordpress-develop

      - name: Configure the test WordPress
        run: |
          sed -e "s/youremptytestdbnamehere/wordpress_test/" \
              -e "s/yourusernamehere/root/" \
              -e "s/yourpasswordhere/root/" \
              -e "s/localhost/127.0.0.1/" \
              /tmp/wordpress-develop/wp-tests-config-sample.php \
              > /tmp/wordpress-develop/wp-tests-config.php

      - name: Install PHPUnit
        run: composer global require --no-interaction "phpunit/phpunit:^9.6" "yoast/phpunit-polyfills:^1.1"

      # This suite went unexecuted for its first ~75 assertions' lifetime
      # because it needed exactly this environment; three real defects shipped
      # in that window. It gates now.
      - name: Run the plugin test suite
        env:
          WP_TESTS_DIR: /tmp/wordpress-develop/tests/phpunit
          WP_TESTS_CONFIG_FILE_PATH: /tmp/wordpress-develop/wp-tests-config.php
          WP_TESTS_PHPUNIT_POLYFILLS_PATH: /home/runner/.composer/vendor/yoast/phpunit-polyfills
        run: $(composer global config home)/vendor/bin/phpunit

  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.2']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      # find's exit status ignores what -exec runs, so the previous
      # `find ... -exec php -l {} \;` form reported success even when a file
      # failed to parse. xargs propagates the failure, so this actually gates.
      - name: Lint PHP files
        run: |
          find . -name '*.php' \
            -not -path './node_modules/*' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -n1 -P4 php -l

      # Lint only proves a file parses. A contract that two classes agree on
      # the shape they pass between them is also valid PHP when it is wrong,
      # and one such mismatch shipped with the targeted lookup silently
      # ingesting nothing. These execute, with no WordPress and no database.
      - name: Run contract checks
        run: |
          for check in tests/contract/*.php; do
            echo "== $check"
            php "$check"
          done

  phpcs:
    name: PHP Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: cs2pr

      - name: Install Composer dependencies
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev wp-coding-standards/wpcs:"^3.0" phpcompatibility/phpcompatibility-wp:"*" dealerdirect/phpcodesniffer-composer-installer:"^1.0"

      # Advisory, not blocking. The ruleset is tuned to the plugin's house
      # formatting, but ~380 substantive findings remain (unprepared SQL
      # interpolation, missing nonce checks, unescaped output, absent
      # docblocks). Those are worth working down, and the annotations show
      # where; failing on them today would leave a permanently red check,
      # which is what got this workflow switched off before.
      #
      # continue-on-error belongs on the step, not the job: at job level the
      # run still goes green but the job's own check stays red, which is the
      # red X this is meant to avoid.
      - name: Run PHPCS
        continue-on-error: true
        run: $(composer global config bin-dir --absolute)/phpcs --standard=.phpcs.xml --report=checkstyle | cs2pr
