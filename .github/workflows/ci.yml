name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  js-tests:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run JS validation tests
        run: npm test

      - name: Verify build
        run: npm run build

  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.2']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      # find's exit status ignores what -exec runs, so the previous
      # `find ... -exec php -l {} \;` form reported success even when a file
      # failed to parse. xargs propagates the failure, so this actually gates.
      - name: Lint PHP files
        run: |
          find . -name '*.php' \
            -not -path './node_modules/*' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -n1 -P4 php -l

  phpcs:
    name: PHP Coding Standards
    runs-on: ubuntu-latest
    # Advisory, not blocking. The ruleset is tuned to the plugin's house
    # formatting, but ~380 substantive findings remain (unprepared SQL
    # interpolation, missing nonce checks, unescaped output, absent
    # docblocks). Those are worth working down, and the annotations below
    # show where; failing the build on them today would only get this
    # workflow switched off again.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: cs2pr

      - name: Install Composer dependencies
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev wp-coding-standards/wpcs:"^3.0" phpcompatibility/phpcompatibility-wp:"*" dealerdirect/phpcodesniffer-composer-installer:"^1.0"

      - name: Run PHPCS
        run: $(composer global config bin-dir --absolute)/phpcs --standard=.phpcs.xml --report=checkstyle | cs2pr
